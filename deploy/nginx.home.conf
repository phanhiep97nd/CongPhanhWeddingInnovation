server {
    listen 80;
    server_name www.hythiep.net;
    return 308 https://hythiep.net$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api { return 308 /api/; }
    location /api/ {
        # Bỏ /api bằng rewrite bên dưới: /api/auth/login → /auth/login.
        # Resolve lại tên service nếu API container được tạo lại và đổi IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Express trust proxy=1: chuyển một IP khách cuối cùng tới API.
        # CF-Connecting-IP chỉ được tin trong mô hình Tunnel trên host này.
        proxy_set_header X-Forwarded-For $visitor_ip;
        proxy_set_header X-Real-IP $visitor_ip;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    # Link-preview bots get the card's own title, description and photo; people get the app.
    location ~ ^/w/ {
        error_page 418 = @share;
        if ($share_bot) { return 418; }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
    location @share {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api:3001;
        rewrite ^/w/([a-z0-9-]+)/?$ /public/weddings/$1/share? break;
        rewrite ^/w/([a-z0-9-]+)/([A-Za-z0-9]+)/?$ /public/weddings/$1/share?g=$2? break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $visitor_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

map $http_user_agent $share_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Zalo|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|Pinterest|WhatsApp|Googlebot|bingbot|Applebot|Skype|viber)" 1;
}

map $http_cf_connecting_ip $visitor_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}
